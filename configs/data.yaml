# Data locations and ingestion settings.
#
# Relative paths resolve against the repo root (the parent of this configs/ dir).

data_root: data

# Fetch windows per season. Deliberately wider than the actual regular season
# (international openers have been as early as Mar 18); requests are filtered
# to regular-season games, so off-days and non-season dates return header-only
# CSVs and cost one cheap request each.
seasons:
  2022: {start: 2022-03-15, end: 2022-10-06}
  2023: {start: 2023-03-15, end: 2023-10-06}
  2024: {start: 2024-03-15, end: 2024-10-06}
  2025: {start: 2025-03-15, end: 2025-10-06}
  2026: {start: 2026-03-15, end: 2026-10-06}

savant:
  base_url: https://baseballsavant.mlb.com/statcast_search/csv
  timeout_s: 120
  max_retries: 5
  backoff_s: 2.0
  # Minimum seconds between request starts. Savant takes ~5 s per day anyway;
  # this just keeps us polite if responses come back from cache.
  min_interval_s: 1.0
  user_agent: stuff-plus/0.1 (personal research project)

# Silver data quality warn checks: reported in silver.dq_results, never block a publish.
quality:
  spin_outage_coverage: 0.5  # share of pitches thrown with spin, per game
  pitches_per_game: {min: 150, max: 450}
  ranges:  # silver units: Savant's, unchanged (mph, rpm, ft)
    release_speed: {min: 30, max: 106}
    release_spin_rate: {min: 0, max: 4000}
    release_extension: {min: 3, max: 9}
    release_pos_z: {min: 0, max: 8}
    pfx_x: {min: -3, max: 3}
    pfx_z: {min: -3, max: 3}
